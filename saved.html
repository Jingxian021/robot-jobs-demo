<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/style.css?v=20261029" />

<body data-page="saved">
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Robot Works</a>
      <nav class="nav">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="ja">日本語</button>
          <button class="lang-btn" data-lang="zh">中文</button>
          <button class="lang-btn" data-lang="de">DE</button>
        </div>
        <a href="compare.html" class="compare-chip hidden" id="compare-chip" title="Compare selected jobs">
          <span data-i18n="nav_compare">Compare</span> <span class="count">0</span>

        <a href="index.html" class="nav-link" data-i18n="nav_jobs">Jobs</a>
      </nav>

  </header>

  <main class="container section">
    <div class="saved-hero">
      <a href="index.html" class="back-link" data-i18n="detail_back">← Back</a>

    <section class="saved-section">
      <h2 class="saved-heading" data-i18n="saved_jobs_heading">Saved jobs</h2>

      <p id="saved-jobs-empty" class="saved-empty text-tertiary" data-i18n="saved_jobs_empty">No saved jobs yet.</p>
    </section>

    <section class="saved-section">
      <h2 class="saved-heading" data-i18n="saved_companies_heading">Followed companies</h2>
      <div id="saved-companies" class="company-list"></div>
      <p id="saved-companies-empty" class="saved-empty text-tertiary" data-i18n="saved_companies_empty">No followed companies yet.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footer_demo">© 2026 Robot Works. Demo only.</span>
        <span>
